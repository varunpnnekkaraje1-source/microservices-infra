apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gethelp-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/varunpnnekkaraje1-source/microservices-infra.git
    targetRevision: main
    path: k8s-manifests/gethelp
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
