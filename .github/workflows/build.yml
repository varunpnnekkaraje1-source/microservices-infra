name: Build and Push gethelp

on:
  push:
    branches: [main]
    paths:
      - 'apps/gethelp/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/gethelp:${{ github.sha }} ./apps/gethelp

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/gethelp:${{ github.sha }}
